
name: Update Taiwan stock snapshot

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 17:30
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python update_data.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.csv.gz data/history.csv.gz data/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stock screener snapshot"
            git push
          fi
